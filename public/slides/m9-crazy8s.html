<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy 8s · Gaming · Слайд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A1F;--panel:#14122E;--ink:#2B2740;--paper:#F3ECDF;--paper-line:#CFC6B4;
    --magenta:#FF2E88;--cyan:#1FE3CE;--amber:#FFC24B;--white:#F4F1FF;--muted:#A39FC8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(255,46,136,.14), transparent 60%),
      radial-gradient(900px 600px at 0% 120%, rgba(31,227,206,.10), transparent 55%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;overflow:hidden;font-family:"Inter",sans-serif;
  }
  #scaler{width:1280px;height:720px;transform-origin:center center}
  .slide{
    position:relative;width:1280px;height:720px;padding:54px 60px 48px;
    display:flex;flex-direction:column;color:var(--white);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 30%), var(--bg);
    border:1px solid rgba(255,255,255,.06);overflow:hidden;
  }
  .slide::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
    mix-blend-mode:overlay;opacity:.5;
  }
  .top{display:flex;align-items:center;justify-content:space-between;z-index:3}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--magenta);font-weight:700}
  .eyebrow span{color:var(--muted)}
  .toprt{display:flex;align-items:center;gap:14px}
  .lang{display:flex;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;border:1.5px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden;user-select:none}
  .lang button{font:inherit;color:var(--muted);background:transparent;border:0;padding:7px 11px;cursor:pointer;letter-spacing:.1em}
  .lang button.on{background:var(--magenta);color:#fff}

  .timer{display:flex;align-items:center;gap:11px;border:1.5px solid rgba(31,227,206,.5);border-radius:10px;padding:7px 10px 7px 8px;background:rgba(31,227,206,.06);transition:border-color .2s,background .2s}
  .timer.run{border-color:var(--cyan);background:rgba(31,227,206,.12)}
  .timer.done{border-color:var(--magenta);background:rgba(255,46,136,.12)}
  .tbtn{font-family:"JetBrains Mono",monospace;font-size:14px;line-height:1;color:var(--bg);background:var(--cyan);border:0;border-radius:7px;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .2s}
  .tbtn:hover{transform:translateY(-1px)}
  .tbtn:active{transform:translateY(0)}
  .tbtn.ghost{background:transparent;color:var(--muted);border:1.5px solid rgba(255,255,255,.18);width:28px;height:28px;font-size:15px}
  .tbtn.ghost:hover{color:var(--white);border-color:rgba(255,255,255,.4)}
  .clk{font-family:"Press Start 2P",monospace;font-size:18px;color:var(--cyan);letter-spacing:1px;min-width:78px;text-align:center}
  .timer.done .clk{color:var(--magenta)}
  .clk .colon{opacity:1}
  .timer.run .clk .colon{animation:blink 1s steps(1) infinite}
  .lab{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;line-height:1.3;min-width:46px}
  @keyframes blink{50%{opacity:.2}}

  .body{flex:1;display:grid;grid-template-columns:430px 1fr;gap:46px;align-items:center;z-index:2;margin-top:6px}
  .stamp{display:inline-block;font-family:"Press Start 2P",monospace;font-size:15px;color:var(--magenta);border:2px solid var(--magenta);border-radius:8px;padding:9px 12px 7px;letter-spacing:1px;text-shadow:0 0 14px rgba(255,46,136,.45);box-shadow:0 0 22px rgba(255,46,136,.18) inset;transform:rotate(-2.5deg)}
  h1{font-weight:900;font-size:46px;line-height:1.04;letter-spacing:-.015em;margin:22px 0 0}
  h1 b{color:var(--magenta)}
  .brief{font-size:16.5px;line-height:1.5;color:var(--muted);margin-top:16px;max-width:42ch}
  .brief em{color:var(--white);font-style:normal;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .chip{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:500;color:var(--white);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 13px;letter-spacing:.02em}
  .submit{margin-top:24px;display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--muted)}
  .submit .k{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--bg);background:var(--amber);border-radius:5px;padding:4px 8px;white-space:nowrap;margin-top:1px}
  .submit b{color:var(--white);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;padding:16px;height:474px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 40px rgba(255,46,136,.10)}

  .cell{position:relative;border-radius:9px;transform:rotate(var(--r,0deg));transition:transform .25s,box-shadow .25s,outline-color .25s;outline:2px solid transparent;outline-offset:2px;perspective:760px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .cell.active{outline-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan),0 0 26px rgba(31,227,206,.6);transform:rotate(0deg) scale(1.05);z-index:4}
  .num{position:absolute;top:6px;left:8px;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--magenta);z-index:5;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.15,.2,1)}
  .cell.open .flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .cover{background:linear-gradient(160deg,#211c4d,#13112e);align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.07)}
  .cover .q{font-family:"Press Start 2P",monospace;font-size:34px;color:var(--magenta);text-shadow:0 0 18px rgba(255,46,136,.55);opacity:.92}
  .sketch{background:var(--paper);transform:rotateY(180deg)}
  .cell svg{display:block;width:100%;height:84px}
  .cell .cap{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;color:var(--ink);text-align:center;padding:6px 4px 0;letter-spacing:-.01em;line-height:1.15}
  .sk{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sk-fill{fill:var(--paper-line);stroke:none}
  .sk-thin{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
  .sk-mag{stroke:var(--magenta)}

  .foot{z-index:2;margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
  .foot b{color:var(--white)}
  .foot .right{color:var(--magenta)}

  @media (prefers-reduced-motion:reduce){
    .timer.run .clk .colon{animation:none}
    .flip{transition:none}
  }
</style>
</head>
<body>
<div id="scaler">
  <section class="slide">
    <div class="top">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="toprt">
        <div class="lang" role="group" aria-label="Language">
          <button id="btn-ru" class="on" onclick="setLang('ru')">RU</button>
          <button id="btn-en" onclick="setLang('en')">EN</button>
        </div>
        <div class="timer" id="timer">
          <button class="tbtn" id="startbtn" title="Start" aria-label="Start / pause">&#9658;</button>
          <div class="clk" id="clk">08<span class="colon">:</span>00</div>
          <div class="lab" id="timerlab"></div>
          <button class="tbtn ghost" id="resetbtn" title="Reset" aria-label="Reset">&#8635;</button>
        </div>
      </div>
    </div>

    <div class="body">
      <div class="left">
        <div class="stamp">GAME&nbsp;OVER</div>
        <h1 id="h1"></h1>
        <p class="brief" id="brief"></p>
        <div class="chips" id="chips"></div>
        <div class="submit">
          <span class="k" id="submitk"></span>
          <span id="submittxt"></span>
        </div>
      </div>

      <div class="grid" id="grid" aria-hidden="true">
        <div class="cell" style="--r:-1deg"><span class="num">01</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><circle class="sk" cx="80" cy="42" r="26"/><path class="sk sk-mag" d="M80 16 a26 26 0 0 1 22 38"/><text x="80" y="48" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#2B2740">92%</text></svg>
            <div class="cap" data-cap="0"></div></div></div></div>
        <div class="cell" style="--r:1.2deg"><span class="num">02</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><rect class="sk" x="56" y="40" width="48" height="30" rx="3"/><path class="sk" d="M56 50 h48"/><rect class="sk-fill" x="74" y="44" width="12" height="10" rx="1"/><path class="sk" d="M52 40 q28 -18 56 0"/><path class="sk sk-mag" d="M118 26 l3 7 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1z"/></svg>
            <div class="cap" data-cap="1"></div></div></div></div>
        <div class="cell" style="--r:-.6deg"><span class="num">03</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><rect class="sk" x="40" y="22" width="80" height="12" rx="3"/><rect class="sk sk-mag" x="40" y="38" width="80" height="12" rx="3"/><rect class="sk" x="40" y="54" width="80" height="12" rx="3"/><circle class="sk-fill" cx="50" cy="28" r="3.2"/><circle class="sk-fill" cx="50" cy="44" r="3.2"/><circle class="sk-fill" cx="50" cy="60" r="3.2"/></svg>
            <div class="cap" data-cap="2"></div></div></div></div>
        <div class="cell" style="--r:1deg"><span class="num">04</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><path class="sk sk-mag" d="M80 18 c10 12 4 18 0 22 c-9 -4 -4 -14 0 -22 z"/><path class="sk" d="M80 30 c14 14 8 30 -0 36 c-16 -8 -12 -24 0 -36z"/><text x="80" y="56" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#F3ECDF">7</text></svg>
            <div class="cap" data-cap="3"></div></div></div></div>
        <div class="cell" style="--r:-1.1deg"><span class="num">05</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><rect class="sk" x="58" y="14" width="44" height="62" rx="6"/><rect class="sk-mag" x="64" y="40" width="32" height="20" rx="4" fill="none" stroke-width="2"/><path class="sk-thin" d="M70 50 h20 M84 45 l6 5 -6 5"/></svg>
            <div class="cap" data-cap="4"></div></div></div></div>
        <div class="cell" style="--r:.7deg"><span class="num">06</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><rect class="sk" x="36" y="40" width="70" height="12" rx="6"/><rect x="38" y="42" width="44" height="8" rx="4" fill="#FF2E88"/><rect class="sk" x="112" y="34" width="18" height="16" rx="2"/><path class="sk" d="M115 34 v-4 a6 6 0 0 1 12 0 v4"/></svg>
            <div class="cap" data-cap="5"></div></div></div></div>
        <div class="cell" style="--r:-.8deg"><span class="num">07</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><circle class="sk" cx="80" cy="42" r="24"/><circle class="sk" cx="80" cy="42" r="14"/><circle class="sk sk-mag" cx="80" cy="42" r="5"/><path class="sk-thin" d="M120 24 v12 M114 30 h12"/></svg>
            <div class="cap" data-cap="6"></div></div></div></div>
        <div class="cell" style="--r:1.3deg"><span class="num">08</span><div class="flip">
          <div class="face cover"><span class="q">?</span></div>
          <div class="face sketch">
            <svg viewBox="0 0 160 88"><circle class="sk" cx="80" cy="42" r="26"/><path class="sk" d="M70 36 l6 4 M90 36 l-6 4"/><path class="sk sk-mag" d="M68 56 q12 -10 24 0"/></svg>
            <div class="cap" data-cap="7"></div></div></div></div>
      </div>
    </div>

    <div class="foot">
      <div id="footleft"></div>
      <div class="right">UX/UI · Gaming track</div>
    </div>
  </section>
</div>

<script>
  var I18N={
    ru:{
      eyebrow:'Встреча&nbsp;9 · От идеи к wireframe&nbsp;&nbsp;<span>// скетчинг · Crazy 8s</span>',
      idlelab:'1&nbsp;мин<br>× 8',
      boxword:'кв.',
      donelab:'время!',
      h1:'8 экранов&nbsp;<b>Game&nbsp;Over</b><br>за 8 минут',
      brief:'Игрок проиграл. Есть <em>2 секунды</em>, чтобы он нажал «Играть снова», а не закрыл игру. Придумайте 8 <em>разных</em> подходов к этому экрану — по одному в каждом квадрате.',
      chips:['<b>1 мин</b> на квадрат','lo-fi · только серый','не оценивать на ходу','подсказки открываются по минуте'],
      submitk:'СДАТЬ',
      submit:'Фото листа + <b>одна механика удержания</b> словом под каждым квадратом. Победителя по dot-voting → переносим в lo-fi wireframe.',
      caps:['Так близко','Утешит. лут','Рекорд друзей','Стрик 7 дней','1 тап рестарт','До разблок.','Новый вызов','Юмор / мем'],
      foot:'Карточки-подсказки открываются по одной — сначала своя идея, потом пример'
    },
    en:{
      eyebrow:'Meeting&nbsp;9 · From idea to wireframe&nbsp;&nbsp;<span>// sketching · Crazy 8s</span>',
      idlelab:'1&nbsp;min<br>× 8',
      boxword:'box',
      donelab:'time!',
      h1:'8 <b>Game&nbsp;Over</b><br>screens in 8 minutes',
      brief:'The player just lost. You have <em>2 seconds</em> to make them tap “Play again” instead of quitting. Sketch 8 <em>different</em> takes on this screen — one per box.',
      chips:['<b>1 min</b> per box','lo-fi · greyscale only','don\u2019t judge mid-sprint','hints unlock each minute'],
      submitk:'SUBMIT',
      submit:'Photo of the sheet + <b>one retention mechanic</b> in a word under each box. Dot-vote the winner → move it into a lo-fi wireframe.',
      caps:['So close','Pity loot','Friends\u2019 score','7-day streak','1-tap restart','To unlock','New challenge','Humor / meme'],
      foot:'Hint cards flip one by one — your idea first, the example after'
    }
  };

  var CUR='ru';
  var cells=[];

  function setLang(l){
    CUR=l;var t=I18N[l];
    document.documentElement.lang=l;
    document.getElementById('eyebrow').innerHTML=t.eyebrow;
    document.getElementById('h1').innerHTML=t.h1;
    document.getElementById('brief').innerHTML=t.brief;
    document.getElementById('chips').innerHTML=t.chips.map(function(c){return '<span class="chip">'+c+'</span>';}).join('');
    document.getElementById('submitk').textContent=t.submitk;
    document.getElementById('submittxt').innerHTML=t.submit;
    document.getElementById('footleft').innerHTML=t.foot;
    document.querySelectorAll('[data-cap]').forEach(function(el){el.textContent=t.caps[+el.getAttribute('data-cap')];});
    document.getElementById('btn-ru').classList.toggle('on',l==='ru');
    document.getElementById('btn-en').classList.toggle('on',l==='en');
    renderLabel();
  }

  /* ---------- TIMER ---------- */
  var TOTAL=8*60, remaining=TOTAL, running=false, tick=null, actx=null;
  var timerEl=document.getElementById('timer'),
      clkEl=document.getElementById('clk'),
      labEl=document.getElementById('timerlab'),
      startBtn=document.getElementById('startbtn');

  function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+'<span class="colon">:</span>'+(ss<10?'0':'')+ss;}
  function curBox(){var el=TOTAL-remaining;return Math.min(8,Math.floor(el/60)+1);}
  function renderLabel(){
    var t=I18N[CUR];
    if(remaining<=0){labEl.innerHTML=t.donelab;}
    else if(running){labEl.innerHTML=t.boxword+'&nbsp;'+curBox()+'/8';}
    else{labEl.innerHTML=t.idlelab;}
  }
  function paintGrid(){
    var b=curBox();
    cells.forEach(function(c,i){c.classList.toggle('active', running && remaining>0 && i===b-1);});
  }
  function revealCard(i){if(cells[i])cells[i].classList.add('open');}
  function render(){clkEl.innerHTML=fmt(remaining);renderLabel();paintGrid();}

  function beep(freq,dur,vol,type){
    if(!actx)return;
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    o.connect(g);g.connect(actx.destination);
    var now=actx.currentTime;
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(vol||0.18,now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    o.start(now);o.stop(now+dur+0.02);
  }
  function flipBlip(){beep(420,0.05,0.12,'triangle');}            /* soft card-flip tick */
  function minuteChime(){beep(660,0.12,0.18);setTimeout(function(){beep(990,0.16,0.2);},120);}
  function endChime(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,0.22,0.22,'square');},i*150);});}

  function start(){
    if(running||remaining<=0)return;
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(actx&&actx.state==='suspended')actx.resume();
    running=true;timerEl.classList.add('run');timerEl.classList.remove('done');
    startBtn.innerHTML='&#10074;&#10074;';startBtn.title='Pause';
    render();
    tick=setInterval(function(){
      remaining--;
      if(remaining>0 && remaining%60===0){
        minuteChime();
        var idx=(TOTAL-remaining)/60-1;     /* the box whose minute just ended */
        setTimeout(function(){flipBlip();revealCard(idx);},90);
      }
      if(remaining<=0){remaining=0;stop(true);}
      render();
    },1000);
  }
  function stop(done){
    running=false;clearInterval(tick);tick=null;
    timerEl.classList.remove('run');
    startBtn.innerHTML='&#9658;';startBtn.title='Start';
    if(done){timerEl.classList.add('done');endChime();setTimeout(function(){flipBlip();revealCard(7);},90);paintGrid();}
    renderLabel();
  }
  function reset(){
    clearInterval(tick);tick=null;running=false;remaining=TOTAL;
    timerEl.classList.remove('run','done');
    startBtn.innerHTML='&#9658;';startBtn.title='Start';
    cells.forEach(function(c){c.classList.remove('active','open');});
    render();
  }
  startBtn.addEventListener('click',function(){running?stop(false):start();});
  document.getElementById('resetbtn').addEventListener('click',reset);
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();running?stop(false):start();}
    if(e.key==='r'||e.key==='R'){reset();}
  });

  /* ---------- init ---------- */
  cells=[].slice.call(document.querySelectorAll('#grid .cell'));
  setLang('ru');
  render();

  (function(){
    var s=document.getElementById('scaler');
    function fit(){var k=Math.min(window.innerWidth/1280, window.innerHeight/720);s.style.transform='scale('+k+')';}
    window.addEventListener('resize',fit);fit();
  })();
</script>
</body>
</html>
